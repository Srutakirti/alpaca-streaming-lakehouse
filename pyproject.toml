[project]
name = "gcp-alpaca-datalake"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
]

[tool.uv.workspace]
members = ["extract", "load", "frontend"]

# Dev/test environment. The workspace members are pulled in as editable installs
# so `uv run pytest` at the repo root has confluent-kafka / pyiceberg / pyarrow /
# fastapi available — the same packages the apps import.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "requests>=2.31",
    "ruff>=0.6",
    "extract",
    "load",
    "frontend",
]

[tool.uv.sources]
extract = { workspace = true }
load = { workspace = true }
frontend = { workspace = true }

[tool.pytest.ini_options]
# Default run = fast unit tests only. Integration/e2e are opt-in via `-m`.
addopts = "-m 'not integration and not e2e'"
testpaths = ["load/tests", "frontend/tests", "tests"]
pythonpath = ["."]
markers = [
    "integration: needs a live Kafka broker (run `make up` first)",
    "e2e: full pipeline (generator -> Kafka -> loader -> Iceberg -> frontend API)",
]
