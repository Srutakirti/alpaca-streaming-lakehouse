[project]
name = "tansu-test"
version = "0.1.0"
description = "Test suite for Tansu Kafka-compatible broker"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.3.0",
]

[project.scripts]
tansu-test = "tansu_test.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tansu_test"]
